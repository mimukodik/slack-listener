\* Liveness of the correct spec with the claim order "least recently claimed first".
\* Liveness: no log, p1 and p2 may die, p3 is a worker that polls fairly.
SPECIFICATION FairSpec
CONSTANTS
    Principals = {p1, p2, p3}
    Workers = {p3}
    Mortal = {p1, p2}
    NTasks = 2
    Keys = {k1}
    Options = {o1, o2}
    BadOption = o3
    NoP = NoP
    NoArg = NoArg
    Nil = Nil
    L = 2
    MaxEvents = 0
    MaxCrash = 1
    LeaseRunsInInput = FALSE
    MemoRefusals = FALSE
    StrictT6 = FALSE
    WithLog = FALSE
    OldestFirst = FALSE
    Bug = "none"
INVARIANTS WaitingQuery
PROPERTIES StaleLeaseLapses LapsedIsReclaimed
CHECK_DEADLOCK FALSE
