\* Planted bug ignoreMemo at the B1-aligned replay bounds.
\* B1-aligned: refusals and none-ready stored under their key, T6 read strictly
\* (as store.ts does). Replay bounds: 2 principals, 1 task, 2 keys each, lease 2.
SPECIFICATION Spec
CONSTANTS
    Principals = {p1, p2}
    Workers = {}
    Mortal = {}
    NTasks = 1
    Keys = {k1, k2}
    Options = {o1, o2}
    BadOption = o3
    NoP = NoP
    NoArg = NoArg
    Nil = Nil
    L = 2
    MaxEvents = 4
    MaxCrash = 0
    LeaseRunsInInput = FALSE
    MemoRefusals = TRUE
    StrictT6 = TRUE
    WithLog = TRUE
    OldestFirst = FALSE
    Bug = "ignoreMemo"
INVARIANTS T1 T2 T3 T4 T5 T6 T7 WaitingQuery AnswerReturnsToAsker
CHECK_DEADLOCK FALSE
