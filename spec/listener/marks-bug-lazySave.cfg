\* Planted: the reaction queue is saved lazily, so a restart replays several calls.
SPECIFICATION Spec
CONSTANTS
    N = 2
    MaxCrash = 1
    MaxFail = 0
    Handled = "ordered"
    Bug = "lazySave"
    Nil = Nil
INVARIANTS NeverBare DoneSticks AtRest DoneMeansAnswered DoneHolds
CHECK_DEADLOCK FALSE
