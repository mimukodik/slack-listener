name: bench

# Temporary (BER-2207): measures the exhaustive pass on GitHub-hosted and
# Blacksmith runners, with a CPU profile, so the per-run cost on CI can be
# explained before and after the simulator changes. Removed before merge.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - blacksmith-2vcpu-ubuntu-2404
          - blacksmith-4vcpu-ubuntu-2404
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Machine
        run: nproc && grep -m1 'model name' /proc/cpuinfo && node --version
      - name: Exhaustive pass, depth 5
        run: node src/sim/exhaustive.ts 5
      - name: Exhaustive pass, depth 5, CPU profile
        run: node --cpu-prof --cpu-prof-dir=prof src/sim/exhaustive.ts 5
      - name: Exhaustive pass, depth 7
        run: node src/sim/exhaustive.ts 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prof-${{ matrix.runner }}
          path: prof/
          retention-days: 3
